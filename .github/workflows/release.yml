name: Release

# Build installers on every version tag (e.g. v0.1.0) and upload them to a
# GitHub Release. electron-builder publishes to a *draft* release by default,
# so you can review the assets and write notes before hitting "Publish".
on:
  push:
    tags:
      - 'v*'

# Required so the built-in GITHUB_TOKEN can create the release and upload assets.
permissions:
  contents: write

jobs:
  # Create the single draft release up front. When the three platform builders
  # started concurrently with no existing draft, each electron-builder created
  # ITS OWN draft and the 14 assets split 5+9 across two same-named releases
  # (v0.13.199). With one draft already present every builder reuses it.
  init-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # --verify-tag fails the job if the tag vanished; ignore "already
          # exists" so reruns are safe.
          gh release create "$TAG" --draft --verify-tag \
            --repo BND-1/horseMD \
            --title "HorseMD ${TAG#v}" \
            --notes "Pending release notes." || \
          gh release view "$TAG" --repo BND-1/horseMD > /dev/null

  release:
    needs: init-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Linux: electron-builder needs libgtk-3-dev and libnotify for desktop
      # integration metadata; dpkg-deb is used to verify the .deb artifact.
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev dpkg

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Package & publish (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish always

      # Linux: verify the .deb is a valid package (not a zero-byte stub from
      # cross-build). Cross-building .deb on macOS produces an invalid ~96-byte
      # file, so this check must run on a real Ubuntu runner.
      - name: Verify Linux .deb artifact
        if: matrix.platform == 'linux'
        run: |
          DEB_FILE=$(ls dist/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::No .deb file found in dist/"
            exit 1
          fi
          echo "Found: $DEB_FILE"
          echo "Size: $(stat -c%s "$DEB_FILE") bytes"
          dpkg-deb --info "$DEB_FILE"
          # #143: postinst must make chrome-sandbox root-owned SUID, otherwise
          # Ubuntu 24.04+ (restricted unprivileged userns) crashes on launch.
          CTRL_DIR=$(mktemp -d)
          dpkg-deb --control "$DEB_FILE" "$CTRL_DIR"
          grep -q "chown root:root '/opt/HorseMD/chrome-sandbox'" "$CTRL_DIR/postinst"
          grep -q "chmod 4755 '/opt/HorseMD/chrome-sandbox'" "$CTRL_DIR/postinst"
          if grep -q "chmod 0755 '/opt/HorseMD/chrome-sandbox'" "$CTRL_DIR/postinst"; then
            echo "::error::postinst still downgrades chrome-sandbox to 0755"
            exit 1
          fi
          echo "✅ .deb artifact is valid (postinst sets SUID chrome-sandbox)"

      # Linux: electron-builder's default draft-publish SKIPS when the release
      # is already published (existingType=release vs publishingType=draft), so
      # upload the .deb explicitly with --clobber to the tag's release.
      - name: Upload Linux .deb to release
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release upload "$TAG" dist/*.deb --clobber

      # Arch Linux (#153): install the pacman package in a clean archlinux
      # container and launch it under Xvfb. Runs after the .deb upload so an
      # Arch-only failure never blocks the Debian package.
      - name: Verify Arch Linux package
        if: matrix.platform == 'linux'
        run: |
          PKG=$(ls dist/*.pkg.tar.xz 2>/dev/null | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::No .pkg.tar.xz file found in dist/"
            exit 1
          fi
          docker run --rm --shm-size=1g -v "$PWD/dist:/dist:ro" -v "$PWD/scripts/ci:/ci:ro" \
            archlinux:latest bash /ci/verify-arch-package.sh "/dist/$(basename "$PKG")"

      - name: Upload Arch Linux package to release
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release upload "$TAG" dist/*.pkg.tar.xz --clobber
