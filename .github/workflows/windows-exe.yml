name: Windows EXE

# Manual Windows installer build for testing. This workflow uploads the EXE as
# a workflow artifact only; it never creates or updates a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build'
        required: true
        default: 'fix/rs-41-rich-source-divergence'
        type: string

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Verify EXE artifact
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter '*.exe' -File
          if ($files.Count -eq 0) {
            Write-Error 'No Windows EXE was produced.'
          }
          $files | ForEach-Object {
            Write-Host "Found: $($_.FullName) ($($_.Length) bytes)"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: HorseMD-windows-exe-${{ github.run_number }}
          # latest.yml + the .exe.blockmap are the electron-updater feed files:
          # the release workflow's electron-builder upload skips them when the
          # tag's release already exists as published (not draft), so this
          # artifact is the recovery source for a complete release.
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7
